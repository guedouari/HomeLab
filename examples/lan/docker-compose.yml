services:

  # -------------------------------------------------------------------
  # Samba — LAN file sharing (SMB/CIFS)
  #
  # network_mode: host — required for Avahi mDNS multicast (macOS/iOS
  #   Bonjour discovery). No port mappings needed or allowed.
  #
  # Auth model: one shared LAN credential — works out of the box on all
  #   clients including Windows, no client configuration needed.
  #
  #   Windows 10+ blocks guest SMB sessions at the client driver level —
  #   no server-side workaround exists. A real account lets Windows
  #   authenticate cleanly: it prompts once, saves to Credential Manager,
  #   and never asks again.
  #
  #   Linux / Android / macOS / iOS: connect as guest automatically.
  #   MAP_TO_GUEST=Bad User maps any unknown/failed login to guest,
  #   so these clients need zero configuration.
  #
  # Default LAN credentials: homelab / homelab
  #   Override SAMBA_PASSWORD in .env to change the password.
  #
  # Discovery (all enabled):
  #   avahi  — Bonjour; macOS Finder + iOS Files (HomeLab.local)
  #   wsdd2  — WS-Discovery; Windows Network sidebar
  #   netbios — legacy; older smart TVs, Android apps
  #
  # macOS/iOS: vfs_fruit + streams_xattr on by default — metadata,
  #   tags and resource forks handled correctly.
  #
  # Shares:
  #   media  — media files (Smart TV, Steam Deck, etc.)
  #   files  — general file exchange
  #   backup — backups
  #
  # First-run permission fix (run once after first start):
  #   docker exec samba chmod -R 777 /shares
  # -------------------------------------------------------------------
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    network_mode: host
    cap_add:
      - CAP_NET_ADMIN          # required by wsdd2
    environment:
      - TZ=${TZ}
      # Shared LAN account — Windows authenticates with this; others connect as guest
      - ACCOUNT_homelab=${SAMBA_PASSWORD:-homelab}
      - SAMBA_CONF_MAP_TO_GUEST=Bad User   # unknown/failed logins → guest
      # Discovery — all enabled
      - AVAHI_NAME=HomeLab
      - SAMBA_CONF_WORKGROUP=WORKGROUP
      - SAMBA_CONF_SERVER_STRING=HomeLab
      # Share definitions — semicolons are translated to newlines by the image
      - "SAMBA_VOLUME_CONFIG_media=[media]; path = /shares/media; guest ok = yes; read only = no; force create mode = 0664; force directory mode = 0775"
      - "SAMBA_VOLUME_CONFIG_files=[files]; path = /shares/files; guest ok = yes; read only = no; force create mode = 0664; force directory mode = 0775"
      - "SAMBA_VOLUME_CONFIG_backup=[backup]; path = /shares/backup; guest ok = yes; read only = no; force create mode = 0664; force directory mode = 0775"
    volumes:
      - ./data/media:/shares/media
      - ./data/files:/shares/files
      - ./data/backup:/shares/backup
    restart: unless-stopped

  # -------------------------------------------------------------------
  # AdGuard Home — DNS ad blocking + local DNS records
  #
  # network_mode: host — required for port 53 (UDP + TCP) without
  #   conflicting with systemd-resolved. Serving port 53 in bridge
  #   mode requires disabling systemd-resolved stub listener first.
  #
  # Setup wizard: skipped if AdGuardHome.yaml exists in the conf volume.
  #   Pre-baked config lives at ./config/adguardhome/AdGuardHome.yaml.
  #   Edit it before first run:
  #     - Set dns.bind_hosts to your server's static LAN IP (or 0.0.0.0)
  #     - Replace the admin password hash
  #     - Update filtering.rewrites with your hostname → LAN IP
  #
  # After starting: set the server's IP as Primary DNS in router DHCP.
  #   All devices on the LAN will use AdGuard Home automatically.
  #
  # Web UI: http://<host-ip>   (admin / see ADGUARD_PASSWORD in .env)
  # -------------------------------------------------------------------
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    network_mode: host
    environment:
      - TZ=${TZ}
    volumes:
      - ./config/adguardhome:/opt/adguardhome/conf
      - ./data/adguardhome:/opt/adguardhome/work
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Uptime Kuma — service uptime monitoring and status dashboard
  #
  # Bridge networking with port 3001 — no multicast needed.
  # extra_hosts allows monitoring host-networked services (Samba, AdGuard).
  #
  # First run: opens a DB setup wizard in the browser (choose SQLite),
  #   then creates an admin account. All stored in ./data/uptime-kuma.
  #
  # Add monitors in the web UI:
  #   HTTP  → http://<host-ip>        (AdGuard Home web UI)
  #   TCP   → <host-ip>:445           (Samba)
  #   DNS   → query google.com via <host-ip>:53 (AdGuard Home DNS)
  #
  # Notifications: configure ntfy, Telegram, or email in Settings.
  # Web UI: http://<host-ip>:3001
  # -------------------------------------------------------------------
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=${TZ}
    volumes:
      - ./data/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # -------------------------------------------------------------------
  # PostgreSQL + pgvector — shared database instance
  #
  # Internal-only: no published ports. Only containers on homelab-net
  #   can reach this. Connect using hostname "postgres" port 5432.
  #
  # pgvector pre-installed — enable in any database with:
  #   CREATE EXTENSION IF NOT EXISTS vector;
  #
  # Per-service setup: add SQL init scripts to ./config/postgres/initdb.d/
  #   They run in filename order on first start only (when data/ is empty).
  #   Example:
  #     CREATE USER myapp WITH PASSWORD 'secret';
  #     CREATE DATABASE myapp OWNER myapp;
  #   Note: send CREATE USER and CREATE DATABASE as separate statements
  #   (not in a single transaction block).
  #
  # Credentials: set POSTGRES_USER and POSTGRES_PASSWORD in .env
  # -------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: postgres
    environment:
      - TZ=${TZ}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/initdb.d:/docker-entrypoint-initdb.d:ro
    networks:
      - homelab-net
    restart: unless-stopped

networks:
  homelab-net:
    driver: bridge
