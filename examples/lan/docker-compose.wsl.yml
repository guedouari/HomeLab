# WSL2 testing notes
#
# The main compose uses network_mode: host. In Docker on WSL2 this means
# the container shares the WSL2 distro's network namespace (eth0 at
# 192.168.x.x), NOT the Windows host network.
#
# Consequences when testing on WSL2:
#
#   Port 445 (SMB):
#     Windows LanmanServer occupies port 445 on all interfaces including
#     the WSL2 virtual adapter. \\<WSL-IP>\share fails from the same
#     Windows machine. Test from a separate device on the LAN.
#
#   Avahi (mDNS):
#     WSL2 uses a NAT network — mDNS multicast does not reach the actual
#     LAN. Avahi will not be visible on other LAN devices during WSL2 dev.
#     Works correctly on real hardware (NAS, Pi).
#
#   WSDD2 (WS-Discovery):
#     Same NAT issue — WSD discovery will not propagate to the LAN from
#     WSL2. Works on real hardware.
#
# There is no port-mapping override for host mode. Run directly:
#   docker compose up -d
#
# To get the WSL2 IP for smbclient testing inside the container:
#   ip -4 addr show eth0
#   docker exec samba smbclient -L //127.0.0.1 -N
