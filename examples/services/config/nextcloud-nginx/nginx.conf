events {}

http {
include       /etc/nginx/mime.types;
default_type  application/octet-stream;
sendfile      on;

upstream php-handler {
    server 127.0.0.1:9000;
}

server {
    listen 8081;
    server_name _;

    root /var/www/html;
    index index.php index.html;

    client_max_body_size 512M;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_types text/plain text/css text/javascript application/javascript
               text/xml application/xml application/json;

    location = /robots.txt {
        allow all;
        log_not_found off;
        access_log off;
    }

    # CalDAV / CardDAV redirects
    location ^~ /.well-known {
        location = /.well-known/carddav { return 301 /remote.php/dav/; }
        location = /.well-known/caldav  { return 301 /remote.php/dav/; }
        return 301 /index.php$request_uri;
    }

    # Block access to internal directories
    location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
        return 404;
    }
    location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
        return 404;
    }

    # PHP via FPM
    location ~ \.php(?:$|/) {
        rewrite ^/(?!index|remote|public|cron)(\/\S+)?$ /index.php$uri last;
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        set $path_info $fastcgi_path_info;
        if (!-f $document_root$fastcgi_script_name) { return 404; }
        fastcgi_param HTTPS on;
        fastcgi_param modHeadersAvailable true;
        fastcgi_param front_controller_active true;
        fastcgi_pass php-handler;
        fastcgi_intercept_errors on;
        fastcgi_request_buffering off;
        fastcgi_max_temp_file_size 0;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $path_info;
    }

    # Static assets (served directly by nginx, no PHP needed)
    location ~ \.(?:css|js|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac)$ {
        try_files $uri /index.php$request_uri;
        expires 6M;
        access_log off;
    }

    location ~ \.woff2?$ {
        try_files $uri /index.php$request_uri;
        expires 7d;
        access_log off;
    }

    location /remote { return 301 /remote.php$request_uri; }

    location / { try_files $uri $uri/ /index.php$request_uri; }
}
}
